name: Contrôler et publier la vitrine

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # met à jour l'état du service toutes les 10 min
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  controler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html terms.html privacy.html manifest.webmanifest sw.js favicon.ico icons media fonts _site/

      - name: Récupérer l'état du service (adresse gardée en secret)
        env:
          BADGE_URL: ${{ secrets.STATUS_BADGE_URL }}
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          up=null; uptime30=null
          if [ -n "$BADGE_URL" ] && curl -fsS --max-time 20 "$BADGE_URL" -o badge.svg && grep -q "<svg" badge.svg; then
            cp badge.svg _site/status.svg
            if grep -q "En ligne" badge.svg; then up=true; else up=false; fi
            # même moniteur, badge « uptime 720 h » : .../api/badge/<id>/status?... -> .../api/badge/<id>/uptime/720
            UPT_URL="${BADGE_URL%%/status*}/uptime/720"
            if curl -fsS --max-time 20 "$UPT_URL" -o upt.svg; then
              v=$(grep -oE '[0-9]+(\.[0-9]+)?%' upt.svg | head -1 | tr -d '%')
              [ -n "$v" ] && uptime30=$v
            fi
          else
            cp status.svg _site/status.svg
          fi
          printf '{"up":%s,"uptime30":%s,"checked":"%s"}\n' "$up" "$uptime30" "$now" > _site/status.json
          cat _site/status.json
          # sécurité : aucune adresse du serveur ne doit finir dans le site
          ! grep -qiE 'https?://|[0-9]+-[0-9]+-[0-9]+-[0-9]+' _site/status.json

      - name: Contrôler liens, images, manifeste et vie privée
        run: python3 scripts/verifier.py _site

      - name: Lighthouse mobile (médiane de 3 passages, bloque si score trop bas)
        if: github.event_name != 'schedule'
        run: |
          python3 -m http.server 8080 --directory _site >/dev/null 2>&1 &
          sleep 2
          LH="npx --yes lighthouse@12 http://localhost:8080/ --quiet --output=json --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate --chrome-flags=--headless=new --chrome-flags=--no-sandbox"
          # 1er passage : mesure la puissance du runner (benchmarkIndex) pour calibrer le ralentissement CPU
          $LH --output-path=calib.json
          MULT=$(python3 -c "import json;b=json.load(open('calib.json'))['environment']['benchmarkIndex'];print(max(1.0,min(4.0,round(4*b/1500,1))))")
          echo "Ralentissement CPU calibré : x$MULT"
          for i in 1 2 3; do $LH --throttling.cpuSlowdownMultiplier=$MULT --output-path=lh$i.json; done
          python3 - <<'EOF'
          import json, statistics, sys, shutil
          runs = [json.load(open(f"lh{i}.json")) for i in (1, 2, 3)]
          mins = {"performance": 0.85, "accessibility": 0.95, "best-practices": 0.90, "seo": 0.90}
          ko = False
          perf = [r["categories"]["performance"]["score"] for r in runs]
          shutil.copy(f"lh{perf.index(statistics.median(perf))+1}.json", "lh.json")
          print("benchmarkIndex :", runs[0]["environment"]["benchmarkIndex"])
          for k, m in mins.items():
              s = statistics.median(r["categories"][k]["score"] for r in runs)
              print(f"{k}: {round(s*100)} (minimum {round(m*100)})")
              ko |= s < m
          sys.exit(1 if ko else 0)
          EOF

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'schedule'
        with:
          name: lighthouse
          path: lh.json
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: controler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
