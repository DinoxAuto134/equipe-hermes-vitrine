<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Une demande, une équipe, un résultat vérifié</title><desc id="desc">Votre demande est confiée à Hermes. Il mobilise Mercure, Argus, Vulcain, Iris et Dédale, puis vérifie le résultat et vous remet une preuve.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1020"/><stop offset="1" stop-color="#12243A"/></linearGradient><linearGradient id="glow"><stop stop-color="#63D5EC"/><stop offset="1" stop-color="#EEC68C"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="860" cy="380" r="280" fill="#244569" opacity=".2" filter="url(#shadow)"/><text x="98" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#63D5EC" text-anchor="start">ÉQUIPE HERMES  /  COMMENT ÇA MARCHE</text><text x="98" y="157" font-family="Segoe UI,Arial,sans-serif" font-size="57" font-weight="700" fill="#F4F6FA" text-anchor="start">Une demande. Une équipe.</text><text x="98" y="219" font-family="Segoe UI,Arial,sans-serif" font-size="57" font-weight="700" fill="#EEC68C" text-anchor="start">Un résultat vérifié.</text><text x="98" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#AFBDD2" text-anchor="start">Chaque spécialiste agit dans son domaine ; Hermes contrôle avant de vous répondre.</text><rect x="98" y="341" width="300" height="396" rx="28" fill="#111B2D" stroke="#395069" stroke-width="2"/><rect x="478" y="341" width="650" height="396" rx="28" fill="#111B2D" stroke="#395069" stroke-width="2"/><rect x="1208" y="341" width="300" height="396" rx="28" fill="#111B2D" stroke="#395069" stroke-width="2"/><text x="131" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#63D5EC" text-anchor="start">01  VOTRE DEMANDE</text><text x="131" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F6FA" text-anchor="start">Vous dites</text><text x="131" y="504" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#F4F6FA" text-anchor="start">votre idée.</text><text x="131" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#AFBDD2" text-anchor="start">Une phrase suffit.</text><text x="131" y="638" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#AFBDD2" text-anchor="start">Hermes organise la suite.</text><text x="513" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#63D5EC" text-anchor="start">02  HERMES COORDONNE</text><rect x="510" y="420" width="586" height="74" rx="16" fill="#1E3448" stroke="#487E91" stroke-width="2"/><text x="534" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#F4F6FA" text-anchor="start">HERMES</text><text x="718" y="465" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#AFBDD2" text-anchor="start">comprend · répartit · contrôle</text><text x="513" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#63D5EC" text-anchor="start">LES SPÉCIALISTES</text><rect x="510" y="570" width="184" height="62" rx="12" fill="#1D3044" stroke="#3D5970" stroke-width="1"/><text x="525" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F6FA" text-anchor="start">Mercure</text><text x="525" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#AFBDD2" text-anchor="start">Mails &amp; agenda</text><rect x="706" y="570" width="184" height="62" rx="12" fill="#1D3044" stroke="#3D5970" stroke-width="1"/><text x="721" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F6FA" text-anchor="start">Argus</text><text x="721" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#AFBDD2" text-anchor="start">Recherche</text><rect x="902" y="570" width="184" height="62" rx="12" fill="#1D3044" stroke="#3D5970" stroke-width="1"/><text x="917" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F6FA" text-anchor="start">Vulcain</text><text x="917" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#AFBDD2" text-anchor="start">Technique</text><rect x="510" y="646" width="184" height="62" rx="12" fill="#1D3044" stroke="#3D5970" stroke-width="1"/><text x="525" y="673" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F6FA" text-anchor="start">Iris</text><text x="525" y="696" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#AFBDD2" text-anchor="start">Création</text><rect x="706" y="646" width="184" height="62" rx="12" fill="#1D3044" stroke="#3D5970" stroke-width="1"/><text x="721" y="673" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F4F6FA" text-anchor="start">Dédale</text><text x="721" y="696" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#AFBDD2" text-anchor="start">Développement</text><text x="1241" y="391" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#EEC68C" text-anchor="start">03  RÉSULTAT VÉRIFIÉ</text><circle cx="1358" cy="485" r="47" fill="#17443F" stroke="#66DEB8" stroke-width="3"/><polyline points="1335,485 1352,502 1382,467" fill="none" stroke="#9CF5CC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="1241" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#F4F6FA" text-anchor="start">Fait, testé, prouvé.</text><text x="1241" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#AFBDD2" text-anchor="start">Un bilan clair</text><text x="1241" y="652" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#AFBDD2" text-anchor="start">et une preuve concrète.</text><polyline points="415,462 463,462" fill="none" stroke="#63D5EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="451,452 463,462 451,472" fill="none" stroke="#63D5EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1143,462 1193,462" fill="none" stroke="#63D5EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1181,452 1193,462 1181,472" fill="none" stroke="#63D5EC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="98" y="811" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#63D5EC" text-anchor="start">DE LA DEMANDE À LA PREUVE</text><text x="98" y="847" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#AFBDD2" text-anchor="start">Un interlocuteur : Hermes. Cinq talents mobilisés au bon moment.</text></svg>